# /etc/nginx/sites-available/truemed  →  symlink into sites-enabled, then:
#   certbot --nginx -d api.truemed.finessedev.space
server {
    listen 80;
    server_name api.truemed.finessedev.space;

    # Pack photos ≤ 8 MB ×2, carton video ≤ 30 MB.
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:4080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scans, carton video and the Investigator stream progress as server-sent
        # events. Buffering would hold every step until the end and the live
        # analysis screen would sit frozen.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
